name: Deploy Angular Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch: # 👈 加上这个才能手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: personal-web-frontend # ← 将 my-angular-app 替换为 dist/ 下实际目录名

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Build Angular App
        run: npm run build -- --configuration production

      - name: Start SSH agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          # 如果设置了 VPS_PORT，请替换下面的端口号
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
        shell: bash

      - name: Ensure target dir exists on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ secrets.VPS_TARGET_DIR }}"
        shell: bash

      - name: Rsync built files to VPS
        run: |
          rsync -az --delete --rsync-path="mkdir -p ${{ secrets.VPS_TARGET_DIR }} && rsync" \
            ./dist/${{ env.PROJECT_NAME }}/ \
            -e "ssh -p ${ { secrets.VPS_PORT }:-22 }" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_TARGET_DIR }}/
        shell: bash

      - name: Reload nginx on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes -p ${ { secrets.VPS_PORT }:-22 } ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo systemctl reload nginx || true"
        shell: bash
