name: Deploy Angular Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: personal-web-frontend # dist 下的目录名

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Build Angular App
        run: npm run build -- --configuration production

      - name: Start SSH agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${VPS_PORT:-22} -H ${VPS_HOST} >> ~/.ssh/known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}

      - name: Ensure target dir exists on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes -p ${VPS_PORT:-22} ${VPS_USER}@${VPS_HOST} "mkdir -p ${VPS_TARGET_DIR}"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}

      - name: Rsync built files to VPS
        run: |
          rsync -az --delete --rsync-path="mkdir -p ${VPS_TARGET_DIR} && rsync" \
            ./dist/${PROJECT_NAME}/browser/ \
            -e "ssh -p ${VPS_PORT:-22}" \
            ${VPS_USER}@${VPS_HOST}:${VPS_TARGET_DIR}/
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}

      - name: Reload nginx on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes -p ${VPS_PORT:-22} ${VPS_USER}@${VPS_HOST} "sudo systemctl reload nginx || true"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
