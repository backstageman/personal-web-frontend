<div class="aritcle-item-center">
  <article class="article-item" (click)="goPreview(article.id)">
    <a aria-label="" target="_blank">
      <img src="assets/images/article-cover-image-default-middle.webp" alt="" />
    </a>
    <div class="article-card-content">
      <!-- <header [routerLink]="{{`'blog/' + article.id`}}"> -->
      <header>
        <h2 class="article-card-title">
          <a>
            <!-- How WebGL and Three.js Power Interactive Online Stores -->
            {{ article.title }}
          </a>
        </h2>
      </header>
      <footer class="article-card-meta">
        <ul class="author-list">
          <li>
            <a href="">
              <img src="assets/images/default-avatar.png" alt="" />
            </a>
            <span>
              <a class="meta-item" href="meta-item" routerLink="">Ajay Kalal</a>
              <time class="meta-item" datetime="2022-03-17T21:33:19.000Z"
                >March 18, 2022</time
              >
            </span>
          </li>
        </ul>
      </footer>
    </div>
  </article>
</div>
