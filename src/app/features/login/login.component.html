<div class="login-container">
  <!-- 左侧蓝色区域 -->
  <div class="login-left">
    <div class="login-left-content">
      <h1>Charlie Media</h1>
      <p>Your personal content management hub.</p>
      <button mat-raised-button color="primary" routerLink="/">
        Visit Website
      </button>
    </div>
  </div>

  <!-- 右侧表单区域 -->
  <div class="login-right">
    <div class="login-form">
      <h2>Welcome Back!</h2>
      <p>Sign in to manage your posts, projects, and everything.</p>

      <!-- 开发模式快速登录区域 -->
      <div *ngIf="isDevMode && hasStoredCredentials" class="dev-quick-login">
        <div class="stored-user-info">
          <h4>开发模式 - 快速登录</h4>
          <p>已保存的用户信息：</p>
          <div class="user-details">
            <mat-icon>person</mat-icon>
            <span>{{ storedUserInfo?.email }}</span>
            <small *ngIf="storedUserInfo?.isDevMode" class="dev-badge">Dev Mode</small>
          </div>
          <div class="quick-actions">
            <button
              mat-stroked-button
              color="primary"
              (click)="quickLogin()"
              [disabled]="loading">
              <mat-icon>flash_on</mat-icon>
              快速登录
            </button>
            <button
              mat-stroked-button
              color="warn"
              (click)="clearStoredCredentials()"
              [disabled]="loading">
              <mat-icon>clear</mat-icon>
              清除信息
            </button>
          </div>
        </div>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="w-full">
          <mat-icon matPrefix>mail</mat-icon>
          <input matInput placeholder="Email Address" formControlName="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-icon matPrefix>lock</mat-icon>
          <input
            matInput
            placeholder="Password"
            type="password"
            formControlName="password"
          />
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="login-btn"
          type="submit"
          [disabled]="loginForm.invalid"
        >
          {{ loading ? "Logging in..." : (isDevMode ? "Dev Mode Login" : "Login") }}
        </button>

        <!-- <a class="forgot-password" routerLink="/forgot-password"
          >Forgot Password</a
        > -->
      </form>
    </div>
  </div>
</div>
