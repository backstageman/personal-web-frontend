<div class="cover-image-upload">
  <!-- 隐藏的文件输入 -->
  <input
    #fileInput
    type="file"
    accept="image/jpeg,image/jpg,image/png,image/gif,image/webp"
    (change)="onFileSelected($event)"
    style="display: none"
  />

  <!-- 没有封面图时显示上传区域 -->
  <div
    *ngIf="!coverImageUrl && !isUploading"
    class="upload-placeholder"
    #dropZone
    [class.dragging]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (mousedown)="selectFile($event)"
  >
    <div class="upload-content">
      <mat-icon class="upload-icon">cloud_upload</mat-icon>
      <div class="upload-text">
        <p class="upload-title">拖拽图片到此处或点击上传</p>
        <p class="upload-hint">支持 JPG、PNG、GIF、WebP 格式，最大 10MB</p>
        <p class="paste-hint">
          <mat-icon class="paste-icon">content_paste</mat-icon>
          也可以使用 Ctrl+V 粘贴剪贴板中的图片
        </p>
      </div>
    </div>
  </div>

  <!-- 上传中显示进度条 -->
  <div *ngIf="isUploading" class="uploading-container">
    <div class="upload-preview">
      <div class="preview-placeholder">
        <mat-icon class="upload-icon">cloud_upload</mat-icon>
        <span class="upload-text">正在上传...</span>
      </div>
    </div>

    <div class="progress-container">
      <mat-progress-bar
        mode="determinate"
        [value]="uploadProgress?.percentage || 0"
        class="upload-progress"
      ></mat-progress-bar>
      <div class="progress-text">
        <span>{{ uploadProgress?.percentage || 0 }}%</span>
        <span *ngIf="uploadProgress" class="file-size">
          ({{ formatFileSize(uploadProgress.loaded) }} /
          {{ formatFileSize(uploadProgress.total) }})
        </span>
      </div>
    </div>
  </div>

  <!-- 已有封面图时显示预览和操作按钮 -->
  <div *ngIf="coverImageUrl && !isUploading && !imageError" class="cover-image-container">
    <div class="image-wrapper">
      <img
        [src]="coverImageUrl"
        alt="封面图"
        class="cover-image"
        (error)="onImageError($event)"
        (load)="onImageLoad($event)"
      />
      <div class="image-overlay">
        <div class="overlay-actions">
          <button
            mat-fab
            color="primary"
            (click)="selectFile($event)"
            class="overlay-btn change-btn"
            matTooltip="更换封面图"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-fab
            color="warn"
            (click)="removeCoverImage()"
            class="overlay-btn delete-btn"
            matTooltip="删除封面图"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 错误状态 -->
  <div *ngIf="imageError" class="error-state">
    <mat-icon class="error-icon">broken_image</mat-icon>
    <p class="error-text">图片加载失败</p>
    <button mat-stroked-button color="primary" (click)="selectFile($event)">
      重新上传
    </button>
  </div>
</div>
