<div class="file-upload-container" 
     (dragover)="onDragOver($event)" 
     (dragleave)="onDragLeave($event)" 
     (drop)="onDrop($event)"
     [class.dragging]="isDragging">
  
  <div class="upload-area" *ngIf="!previewUrl" (click)="onClick()">
    <div class="upload-content">
      <mat-icon class="upload-icon">cloud_upload</mat-icon>
      <p class="upload-text">{{ placeholder }}</p>
      <p class="upload-hint">支持拖拽、粘贴和点击选择文件</p>
      <p class="upload-limit">文件大小限制：{{ formatFileSize(maxSize) }}</p>
    </div>
    <input 
      #fileInput
      type="file" 
      [accept]="accept"
      (change)="onFileSelect($event)"
      style="display: none;">
  </div>
  
  <div class="preview-area" *ngIf="previewUrl">
    <div class="preview-container">
      <img [src]="previewUrl" alt="预览图片" class="preview-image" />
      <div class="preview-overlay">
        <button mat-icon-button (click)="removeImage()" class="remove-btn">
          <mat-icon>delete</mat-icon>
        </button>
        <button mat-icon-button (click)="onClick()" class="change-btn">
          <mat-icon>edit</mat-icon>
        </button>
      </div>
    </div>
    <input 
      #fileInput
      type="file" 
      [accept]="accept"
      (change)="onFileSelect($event)"
      style="display: none;">
  </div>
  
  <div class="loading-overlay" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
  </div>
</div>
